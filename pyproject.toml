[project]
name = "java-blueprints"
version = "0.1.0"
description = "Explore Java programs as code and method graphs"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
